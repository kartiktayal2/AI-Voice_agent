<!DOCTYPE html>
<html>
<head>
    <title>AI Voice Agent</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        #chat {
            border: 1px solid #ccc;
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .user {
            margin: 10px 0;
        }

        .ai {
            margin: 10px 0;
        }

        #startButton {
            display: block;
            margin: auto;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #status {
            text-align: center;
            font-weight: bold;
            margin: 20px;
        }
    </style>
</head>

<body>

<h1>AI Voice Agent</h1>

<div id="chat"></div>

<button id="startButton">
    🎤 Start Voice Agent
</button>

<div id="status">
    Click Start Voice Agent
</div>


<script>

/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let stream = null;
let recorder = null;
let chunks = [];

let audioContext = null;
let analyser = null;
let microphone = null;

let currentAudio = null;

let agentRunning = false;

/*
    State machine:

    STOPPED
    LISTENING
    RECORDING
    PROCESSING
    SPEAKING
*/

let state = "STOPPED";

let animationFrameId = null;


/* =========================================================
   SPEECH DETECTION SETTINGS
   ========================================================= */

/*
    How loud audio must be before we consider it
    possible speech.

    0.02 was too sensitive in your environment
    because of the ceiling fan.

    Start with 0.035.
*/
const SPEECH_THRESHOLD = 0.035;


/*
    Audio must remain above the threshold for this
    amount of time before we decide that the user
    actually started speaking.

    This prevents small noise spikes from starting
    a recording.
*/
const SPEECH_CONFIRMATION_TIME = 250;


/*
    User must remain quiet for this amount of time
    before we decide the sentence has ended.
*/
const SILENCE_LIMIT = 1200;


/*
    Ignore extremely short recordings.
*/
const MIN_RECORDING_TIME = 500;


/*
    Minimum blob size.

    This is only a secondary safety check.
    We do NOT use file size as the main
    speech detection mechanism.
*/
const MIN_AUDIO_SIZE = 10000;


/* =========================================================
   SPEECH DETECTION VARIABLES
   ========================================================= */

let speechCandidateStart = null;
let silenceStart = null;

let recordingStartTime = null;


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const button =
    document.getElementById("startButton");

const status =
    document.getElementById("status");

const chat =
    document.getElementById("chat");


/* =========================================================
   START / STOP WHOLE VOICE AGENT
   ========================================================= */

button.onclick = async function () {

    if (agentRunning) {

        stopAgent();

        return;
    }


    try {

        /*
            Important microphone settings.

            echoCancellation:
            Helps prevent the AI's speaker output
            from being detected as user speech.

            noiseSuppression:
            Helps reduce background noise such
            as fans.

            autoGainControl:
            Helps normalize microphone volume.
        */

        stream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });


        /*
            Create audio processing context.
        */

        audioContext =
            new AudioContext();


        /*
            Create analyser.
        */

        analyser =
            audioContext.createAnalyser();

        analyser.fftSize = 2048;


        /*
            Connect microphone to analyser.
        */

        microphone =
            audioContext.createMediaStreamSource(
                stream
            );

        microphone.connect(analyser);


        /*
            Start agent.
        */

        agentRunning = true;

        state = "LISTENING";


        button.innerText =
            "⏹ Stop Voice Agent";


        status.innerText =
            "🎤 Listening...";


        /*
            Start ONE monitoring loop.
        */

        monitorAudio();


    } catch (error) {

        console.error(error);

        status.innerText =
            "❌ Microphone permission denied";

    }

};


/* =========================================================
   MONITOR MICROPHONE
   ========================================================= */

function monitorAudio() {

    /*
        Do not create multiple monitoring loops.
    */

    if (!agentRunning) {
        return;
    }


    /*
        Read microphone volume.
    */

    const data =
        new Uint8Array(
            analyser.fftSize
        );


    analyser.getByteTimeDomainData(data);


    /*
        Calculate RMS volume.
    */

    let sum = 0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const value =
            (data[i] - 128) / 128;

        sum += value * value;

    }


    const volume =
        Math.sqrt(
            sum / data.length
        );


    const now = Date.now();


    /* =====================================================
       LISTENING STATE
       ===================================================== */

    if (state === "LISTENING") {

        /*
            Possible speech detected.
        */

        if (volume > SPEECH_THRESHOLD) {

            /*
                Start confirmation timer.
            */

            if (speechCandidateStart === null) {

                speechCandidateStart = now;

            }


            /*
                Has the sound remained loud enough
                for long enough?
            */

            const speechDuration =
                now - speechCandidateStart;


            if (
                speechDuration >=
                SPEECH_CONFIRMATION_TIME
            ) {

                console.log(
                    "Speech confirmed."
                );


                speechCandidateStart = null;

                startRecording();

            }

        } else {

            /*
                Noise disappeared before the
                confirmation period.

                Ignore it.
            */

            speechCandidateStart = null;

        }

    }


    /* =====================================================
       RECORDING STATE
       ===================================================== */

    else if (state === "RECORDING") {

        /*
            User is speaking.
        */

        if (volume > SPEECH_THRESHOLD) {

            /*
                Reset silence timer.
            */

            silenceStart = null;

        }

        /*
            User is quiet.
        */

        else {

            if (silenceStart === null) {

                silenceStart = now;

            }


            const silenceDuration =
                now - silenceStart;


            const recordingDuration =
                now - recordingStartTime;


            /*
                Stop only after:

                1. Enough recording time
                2. Enough silence
            */

            if (
                silenceDuration >=
                    SILENCE_LIMIT
                &&
                recordingDuration >=
                    MIN_RECORDING_TIME
            ) {

                console.log(
                    "Sentence finished."
                );


                stopRecording();

            }

        }

    }


    /* =====================================================
       PROCESSING STATE
       ===================================================== */

    else if (state === "PROCESSING") {

        /*
            Do absolutely nothing.

            We do NOT allow microphone noise to
            start another recording while:

            Whisper
            Ollama
            Piper

            are working.
        */

    }


    /* =====================================================
       SPEAKING STATE
       ===================================================== */

    else if (state === "SPEAKING") {

        /*
            For now, don't automatically start
            recording during AI playback.

            This prevents the ceiling fan and
            speaker output from creating another
            recording.

            Barge-in/interruption can be added
            after the basic recording pipeline
            is stable.
        */

    }


    /*
        Continue ONE monitoring loop.
    */

    animationFrameId =
        requestAnimationFrame(
            monitorAudio
        );

}


/* =========================================================
   START RECORDING
   ========================================================= */

function startRecording() {

    /*
        Safety checks.
    */

    if (!agentRunning) {
        return;
    }


    if (state !== "LISTENING") {
        return;
    }


    if (
        recorder &&
        recorder.state === "recording"
    ) {
        return;
    }


    console.log(
        "Starting recording..."
    );


    /*
        Reset recording data.
    */

    chunks = [];

    silenceStart = null;

    recordingStartTime =
        Date.now();


    /*
        Create MediaRecorder.
    */

    recorder =
        new MediaRecorder(
            stream
        );


    /*
        Receive audio chunks.
    */

    recorder.ondataavailable =
        function (event) {

            if (
                event.data &&
                event.data.size > 0
            ) {

                chunks.push(
                    event.data
                );

            }

        };


    /*
        Recording stopped.
    */

    recorder.onstop =
        async function () {

            /*
                Save recording duration
                before resetting variables.
            */

            const recordingDuration =
                Date.now() -
                recordingStartTime;


            recording = false;


            /*
                Create audio blob.
            */

            const audioBlob =
                new Blob(
                    chunks,
                    {
                        type: "audio/webm"
                    }
                );


            console.log(
                "Recording duration:",
                recordingDuration,
                "ms"
            );


            console.log(
                "Audio size:",
                (
                    audioBlob.size / 1024
                ).toFixed(2),
                "KB"
            );


            /*
                Safety check #1:
                Agent stopped.
            */

            if (!agentRunning) {

                chunks = [];

                recorder = null;

                return;

            }


            /*
                Safety check #2:
                Recording too short.
            */

            if (
                recordingDuration <
                MIN_RECORDING_TIME
            ) {

                console.log(
                    "Recording too short. Discarding."
                );


                chunks = [];

                recorder = null;

                state = "LISTENING";

                status.innerText =
                    "🎤 Listening...";

                return;

            }


            /*
                Safety check #3:
                Very small audio file.
            */

            if (
                audioBlob.size <
                MIN_AUDIO_SIZE
            ) {

                console.log(
                    "Audio too small. Discarding."
                );


                chunks = [];

                recorder = null;

                state = "LISTENING";

                status.innerText =
                    "🎤 Listening...";

                return;

            }


            /*
                We now have a real recording.

                Stop listening while backend
                processes it.
            */

            state = "PROCESSING";


            status.innerText =
                "⏳ Processing...";


            /*
                Prepare request.
            */

            const formData =
                new FormData();


            formData.append(
                "file",
                audioBlob,
                "voice.webm"
            );


            try {

                console.log(
                    "Sending audio to backend..."
                );


                const response =
                    await fetch(
                        "/voice",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Backend returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                /*
                    If Whisper didn't hear anything,
                    don't display an empty user message.
                */

                if (
                    data.user_text &&
                    data.user_text.trim()
                ) {

                    chat.innerHTML += `
                        <div class="user">
                            <b>You:</b>
                            ${escapeHtml(
                                data.user_text
                            )}
                        </div>
                    `;

                }


                /*
                    Display AI response only if
                    one exists.
                */

                if (
                    data.response &&
                    data.response.trim()
                ) {

                    chat.innerHTML += `
                        <div class="ai">
                            <b>AI:</b>
                            ${escapeHtml(
                                data.response
                            )}
                        </div>
                    `;

                }


                chat.scrollTop =
                    chat.scrollHeight;


                /*
                    Play AI response.
                */

                if (data.audio) {

                    state = "SPEAKING";

                    status.innerText =
                        "🔊 AI speaking...";


                    currentAudio =
                        new Audio(
                            data.audio +
                            "?t=" +
                            Date.now()
                        );


                    /*
                        AI finished speaking.
                    */

                    currentAudio.onended =
                        function () {

                            currentAudio = null;

                            if (agentRunning) {

                                state =
                                    "LISTENING";

                                status.innerText =
                                    "🎤 Listening...";

                            }

                        };


                    /*
                        Handle playback error.
                    */

                    currentAudio.onerror =
                        function (error) {

                            console.error(
                                "Audio playback error:",
                                error
                            );


                            currentAudio = null;


                            if (agentRunning) {

                                state =
                                    "LISTENING";

                                status.innerText =
                                    "🎤 Listening...";

                            }

                        };


                    /*
                        Start playback.
                    */

                    currentAudio.play()
                        .catch(
                            function (error) {

                                console.error(
                                    "Audio play error:",
                                    error
                                );


                                currentAudio = null;


                                if (agentRunning) {

                                    state =
                                        "LISTENING";

                                    status.innerText =
                                        "🎤 Listening...";

                                }

                            }
                        );

                }

                else {

                    /*
                        No audio response.
                    */

                    state = "LISTENING";

                    status.innerText =
                        "🎤 Listening...";

                }


            } catch (error) {

                console.error(
                    error
                );


                state = "LISTENING";

                status.innerText =
                    "❌ Error processing voice";

            }


            /*
                Clean up.
            */

            chunks = [];

            recorder = null;

            silenceStart = null;

            speechCandidateStart = null;

        };


    /*
        Change state BEFORE starting recorder.
    */

    state = "RECORDING";


    status.innerText =
        "🎤 Recording...";


    /*
        Start recording.

        100 ms timeslice means the browser
        periodically provides audio chunks.
    */

    recorder.start(100);

}


/* =========================================================
   STOP CURRENT RECORDING
   ========================================================= */

function stopRecording() {

    if (
        recorder &&
        recorder.state === "recording"
    ) {

        console.log(
            "Stopping recording..."
        );


        recorder.stop();

    }

}


/* =========================================================
   STOP WHOLE VOICE AGENT
   ========================================================= */

function stopAgent() {

    console.log(
        "Stopping voice agent..."
    );


    agentRunning = false;

    state = "STOPPED";


    /*
        Cancel monitoring loop.
    */

    if (animationFrameId !== null) {

        cancelAnimationFrame(
            animationFrameId
        );

        animationFrameId = null;

    }


    /*
        Stop current AI audio.
    */

    if (currentAudio) {

        currentAudio.pause();

        currentAudio.currentTime = 0;

        currentAudio = null;

    }


    /*
        Stop recorder.
    */

    if (
        recorder &&
        recorder.state === "recording"
    ) {

        recorder.stop();

    }


    /*
        Stop microphone.
    */

    if (stream) {

        stream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    /*
        Close audio context.
    */

    if (audioContext) {

        audioContext.close();

    }


    /*
        Reset variables.
    */

    stream = null;

    recorder = null;

    chunks = [];

    recording = false;

    silenceStart = null;

    speechCandidateStart = null;

    recordingStartTime = null;


    button.innerText =
        "🎤 Start Voice Agent";


    status.innerText =
        "Voice agent stopped.";

}


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
