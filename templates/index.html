<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice Agent</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      text-align: center;
    }

    #chat {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .user, .ai {
      margin: 12px 0;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin: 20px 0;
      min-height: 1.2em;
    }
  </style>
</head>

<body>
  <h1>AI Voice Agent</h1>

  <div id="chat" aria-live="polite"></div>

  <div class="controls">
    <button id="startButton">🎤 Start Recording</button>
    <button id="submitButton" disabled>✓ Submit Question</button>
  </div>

  <div id="status">
    Click Start Recording to ask a question.
  </div>

  <script>
    let stream = null;
    let recorder = null;
    let chunks = [];
    let currentAudio = null;
    let isProcessing = false;

    const startButton = document.getElementById("startButton");
    const submitButton = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const chat = document.getElementById("chat");

    startButton.addEventListener("click", startRecording);
    submitButton.addEventListener("click", submitRecording);

    async function startRecording() {
      if (isProcessing || (recorder && recorder.state === "recording")) {
        return;
      }

      try {
        if (!stream || !stream.active) {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });
        }

        chunks = [];

        const options = MediaRecorder.isTypeSupported(
          "audio/webm;codecs=opus"
        )
          ? { mimeType: "audio/webm;codecs=opus" }
          : {};

        recorder = new MediaRecorder(stream, options);

        recorder.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) {
            chunks.push(event.data);
          }
        });

        recorder.start(100);

        startButton.disabled = true;
        submitButton.disabled = false;

        status.textContent =
          "🔴Recording in progress...";

      } catch (error) {
        console.error("Microphone error:", error);

        status.textContent =
          "❌ Microphone access unavailable. Check permissions.";

        startButton.disabled = false;
        submitButton.disabled = true;
      }
    }

    async function submitRecording() {
      if (
        !recorder ||
        recorder.state !== "recording" ||
        isProcessing
      ) {
        return;
      }

      isProcessing = true;
      startButton.disabled = true;
      submitButton.disabled = true;

      status.textContent =
        "⏳ Submitting audio and processing your question...";

      const activeRecorder = recorder;

      activeRecorder.addEventListener("stop", async () => {
        const mimeType = activeRecorder.mimeType || "audio/webm";

        const audioBlob = new Blob(chunks, {
          type: mimeType
        });

        chunks = [];
        recorder = null;

        if (audioBlob.size < 1000) {
          status.textContent =
            "⚠️ The recording was too short. Click Start Recording and try again.";

          finishProcessing();
          return;
        }

        const formData = new FormData();

        formData.append("file", audioBlob, "voice.webm");

        try {
          const response = await fetch("/voice", {
            method: "POST",
            body: formData
          });

          if (!response.ok) {
            throw new Error(`Backend returned ${response.status}`);
          }

          const data = await response.json();

          if (data.user_text && data.user_text.trim()) {
            appendMessage("You", data.user_text, "user");
          }

          if (data.response && data.response.trim()) {
            appendMessage("AI", data.response, "ai");
          }

          if (data.audio) {
            status.textContent = "🔊 Playing response...";

            currentAudio = new Audio(
              `${data.audio}?t=${Date.now()}`
            );

            currentAudio.addEventListener("ended", () => {
              currentAudio = null;
              finishProcessing();

              status.textContent =
                "✅ Ready. Click Start Recording for your next question.";
            }, { once: true });

            currentAudio.addEventListener("error", () => {
              currentAudio = null;
              finishProcessing();

              status.textContent =
                "⚠️ Audio playback failed. Please try again.";
            }, { once: true });

            try {
              await currentAudio.play();
            } catch (error) {
              console.error("Audio playback error:", error);

              currentAudio = null;
              finishProcessing();

              status.textContent =
                "⚠️ Unable to play audio. Please try again.";
            }

          } else {
            finishProcessing();

            status.textContent =
              "✅ Ready. Click Start Recording for your next question.";
          }

        } catch (error) {
          console.error("Voice request failed:", error);

          finishProcessing();

          status.textContent =
            "❌ Request failed. Please try again.";
        }

      }, { once: true });

      activeRecorder.stop();
    }

    function finishProcessing() {
      isProcessing = false;
      startButton.disabled = false;
      submitButton.disabled = true;
    }

    function appendMessage(label, message, className) {
      const wrapper = document.createElement("div");
      wrapper.className = className;

      const heading = document.createElement("b");
      heading.textContent = `${label}: `;

      wrapper.appendChild(heading);
      wrapper.appendChild(document.createTextNode(message));

      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
    }

    window.addEventListener("beforeunload", () => {
      if (currentAudio) {
        currentAudio.pause();
      }

      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }
    });
  </script>
</body>
</html>
